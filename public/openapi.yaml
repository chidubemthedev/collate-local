openapi: 3.1.0
info:
  title: Collate API
  version: 1.0.0
  description: |
    Collate backend API: email-OTP authentication, geography, polling-unit
    coverage, agents, broadcasts, the Telegram bot webhook and admin queue
    monitoring.

    ## Response envelope

    Successes: `{ "status": "success", "data": ..., "meta"?: { nextCursor, limit, ... } }`.
    Failures: `{ "status": "error", "error": { "code", "message", "fields"? } }`.
    `fields` is only present on `validation_failed`.

    | Error code | HTTP status |
    |---|---|
    | `validation_failed`, `invalid_filter` | 400 |
    | `unauthorized`, `invalid_or_expired_code` | 401 |
    | `forbidden`, `invalid_origin` | 403 |
    | `not_found` | 404 |
    | `conflict` | 409 |
    | `too_many_requests` | 429 (with `Retry-After: 60`, except OTP request) |
    | `internal_error` | 500 |

    The API never returns 422; malformed input is always 400.

    ## Authentication

    Protected endpoints use the HTTP-only session cookie issued by
    `POST /api/auth/otp/verify`. The cookie is named `collate_session` outside
    production and `__Host-collate_session` in production. Sessions last 12 hours
    absolute with a 2 hour idle timeout. Swagger UI sends same-origin cookies
    automatically after a successful sign-in. Swagger UI uses `SERVER_BASE_URL`
    from the environment for the server URL when set.

    ## Conventions

    - Mutating routes (`POST`, `DELETE`) require an `Origin` header that matches
      the request origin; otherwise they return 403 `invalid_origin`.
    - Lists use opaque keyset cursors (`meta.nextCursor`) and cap `limit` at 100.
      `/api/coverage/gaps` is the exception: offset pagination, `limit` up to 500.
    - Phone numbers are always masked in responses.
    - Routes that return individual person data write an `audit_log` row.
servers:
  - url: /
    description: Current Collate deployment
tags:
  - name: Health
    description: Liveness and database connectivity.
  - name: Authentication
    description: Email OTP sign-in, session and permissions.
  - name: Agents
    description: Polling-unit agents visible to the caller.
  - name: Admin
    description: Administrator-only operations.
  - name: Broadcasts
    description: Audience preview, creation, listing and delivery tracking.
  - name: Geography
    description: State, LGA, ward and polling-unit drill-down with coverage counts.
  - name: Coverage
    description: Coverage totals, candidate coverage, gaps and agent assignments.
  - name: Telegram
    description: Inbound Telegram bot webhook.
  - name: Development
    description: Dev-only utilities. These return 404 when `NODE_ENV=production`.
  - name: Docs
    description: This specification and Swagger UI.
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check service health
      security: []
      responses:
        "200":
          description: Database is reachable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OkData"
        "500":
          description: Database health check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/otp/request:
    post:
      tags: [Authentication]
      summary: Request an email one-time password
      description: Requires an eligible registered person. Requests are rate-limited per email and IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: person@example.com
              required: [email]
            example:
              email: person@example.com
      responses:
        "200":
          description: OTP sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOkResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No eligible person found for the email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/otp/verify:
    post:
      tags: [Authentication]
      summary: Verify an OTP and create a session
      description: |
        On success, sets the HTTP-only session cookie in the response. Malformed bodies,
        unknown emails, wrong codes and expired codes all return the same 401
        `invalid_or_expired_code`. An OTP allows 5 failed attempts and is valid for 10 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^\\d{6}$"
                  example: "123456"
              required: [email, code]
            example:
              email: person@example.com
              code: "123456"
      responses:
        "200":
          description: OTP verified and session cookie set.
          headers:
            Set-Cookie:
              description: HTTP-only session cookie; cookie name varies by environment.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOkResponse"
        "401":
          description: OTP is invalid, expired, already used, or malformed (`invalid_or_expired_code`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/session:
    get:
      tags: [Authentication]
      summary: Read the current session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session state. An absent, expired, or invalid session returns authenticated false.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - type: object
                            properties:
                              authenticated:
                                type: boolean
                                const: false
                            required: [authenticated]
                          - type: object
                            properties:
                              authenticated:
                                type: boolean
                                const: true
                              person:
                                $ref: "#/components/schemas/SessionPerson"
                            required: [authenticated, person]
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session revoked and cookie cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOkResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/permissions:
    get:
      tags: [Authentication]
      summary: Read roles and permission flags
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authenticated caller permissions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PermissionsData"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/admin/queue:
    get:
      tags: [Admin]
      summary: Read the background job queue
      description: Requires an authenticated administrator. Returns job counts by name and up to 50 recent jobs.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Queue summary and recent jobs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminQueueData"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/agents:
    get:
      tags: [Agents]
      summary: List visible agents
      description: Returns authorized agents with masked phone numbers and cursor pagination.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateFilter"
        - $ref: "#/components/parameters/lgaFilter"
        - $ref: "#/components/parameters/wardFilter"
        - $ref: "#/components/parameters/politicalUnitFilter"
        - name: ownerGroupId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: ownerCandidateId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: agentKind
          in: query
          schema:
            type: string
            enum: [official, extra]
        - name: channel
          in: query
          description: Telegram readiness. `telegram` means a confirmed linked phone and accepted consent.
          schema:
            type: string
            enum: [telegram, not_connected]
        - name: q
          in: query
          description: Case-insensitive match on name, polling unit, ward or LGA.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Visible agent page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Agent"
                      meta:
                        $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/agents/summary:
    get:
      tags: [Agents]
      summary: Count visible agents by role and Telegram readiness
      description: Aggregate counts only; no individual data is returned. Ignores agentKind and channel so tab counts stay stable.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateFilter"
        - $ref: "#/components/parameters/lgaFilter"
        - $ref: "#/components/parameters/wardFilter"
        - $ref: "#/components/parameters/politicalUnitFilter"
        - name: ownerGroupId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: ownerCandidateId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Agent counts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AgentSummary"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/broadcasts/preview:
    post:
      tags: [Broadcasts]
      summary: Preview an audience
      description: Returns the official and extra agent counts the caller's filters would reach. The request must include a matching Origin header.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudienceFilter"
            example:
              stateId: 1
              lgaId: 12
              pollingUnitId: 120
              verificationStatus: verified
              agentKind: all
      responses:
        "200":
          description: Audience counts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AudiencePreview"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/broadcasts:
    get:
      tags: [Broadcasts]
      summary: List broadcasts
      description: Admins see every broadcast; other callers see only broadcasts they sent. Delivery counts are grouped in one query, and sender/audience labels contain no personal phone data.
      security:
        - sessionCookie: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of broadcasts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/BroadcastListItem"
                      meta:
                        $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Broadcasts]
      summary: Create a broadcast
      description: Creates a broadcast and queues audience resolution. The request must include a matching Origin header. Scheduled broadcasts are queued for their send time.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBroadcastInput"
            example:
              audienceFilter:
                stateId: 1
                agentKind: official
              messageText: "Polling units open at 8am. Please be at your post by 7:30."
              scheduledSendAt: "2027-02-20T06:00:00+01:00"
      responses:
        "201":
          description: Broadcast created and queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreatedBroadcast"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/broadcasts/{broadcastId}:
    get:
      tags: [Broadcasts]
      summary: Read a broadcast
      description: Returns broadcast details and delivery counts. A broadcast outside the caller's visibility returns 404.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/broadcastId"
      responses:
        "200":
          description: Broadcast detail and delivery counts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BroadcastDetail"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/broadcasts/{broadcastId}/deliveries:
    get:
      tags: [Broadcasts]
      summary: List broadcast deliveries
      description: Returns delivery rows with masked phone numbers and available delivery timestamps, and writes an audit event. Per-recipient assignment area, group, and source citation are not stored with delivery records. A broadcast outside the caller's visibility returns 404.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/broadcastId"
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/BroadcastDelivery"
                      meta:
                        $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/geography/states:
    get:
      tags: [Geography]
      summary: List accessible states and coverage counts
      security:
        - sessionCookie: []
      responses:
        "200":
          description: States available within the caller's membership scope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/StateCoverage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/geography/states/{stateId}:
    get:
      tags: [Geography]
      summary: Read state coverage
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateId"
      responses:
        "200":
          description: State coverage.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/StateCoverage"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/geography/states/{stateId}/lgas:
    get:
      tags: [Geography]
      summary: List accessible LGAs in a state
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateId"
      responses:
        "200":
          description: LGAs and their coverage counts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/LgaCoverage"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/geography/lgas/{lgaId}/wards:
    get:
      tags: [Geography]
      summary: List accessible wards in an LGA
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/lgaId"
      responses:
        "200":
          description: Wards and their coverage counts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/WardCoverage"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/geography/wards/{wardId}/polling-units:
    get:
      tags: [Geography]
      summary: List accessible polling units and assigned agents in a ward
      description: Cursor-paginated by polling unit code. Returns masked agent phone numbers and writes an audit log row.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/wardId"
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: gps
          in: query
          description: GPS presence filter. `with` excludes null and zero coordinates; `without` includes both.
          schema:
            type: string
            enum: [all, with, without]
            default: all
      responses:
        "200":
          description: A page of polling units with location and agent details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PollingUnit"
                      meta:
                        $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/coverage/summary:
    get:
      tags: [Coverage]
      summary: Get coverage totals
      description: Counts an official assignment as covered. Filters can be combined.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateFilter"
        - $ref: "#/components/parameters/lgaFilter"
        - $ref: "#/components/parameters/wardFilter"
        - $ref: "#/components/parameters/politicalUnitFilter"
      responses:
        "200":
          description: Coverage totals for the accessible filtered area.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CoverageSummary"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/coverage/map-points:
    get:
      tags: [Coverage]
      summary: Get grouped polling-unit coordinates
      description: >-
        Returns the exact latitude/longitude groups for polling units in the caller's accessible
        area. Each point includes total and officially covered polling-unit counts; agent or
        personal data is not included. Coordinate values may be approximate.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateFilter"
        - $ref: "#/components/parameters/lgaFilter"
        - $ref: "#/components/parameters/wardFilter"
        - $ref: "#/components/parameters/politicalUnitFilter"
      responses:
        "200":
          description: Coordinate groups for the accessible filtered area.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CoverageMapPointsResponse"
              example:
                status: success
                data:
                  points:
                    - latitude: 6.5244
                      longitude: 3.3792
                      totalPUs: 3
                      coveredPUs: 2
                    - latitude: 9.0765
                      longitude: 7.3986
                      totalPUs: 1
                      coveredPUs: 0
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/coverage/candidates:
    get:
      tags: [Coverage]
      summary: List candidates with coverage for their seat
      description: >-
        Returns principal candidates whose seat contains polling units in the accessible filtered area.
        Counts are limited to that area. A polling unit is covered when it has an official
        assignment, whichever group owns it. Extra agents are counted only when the candidate owns them.
        Ordered by office hierarchy, then candidate ID. Writes an audit log row.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateFilter"
        - $ref: "#/components/parameters/lgaFilter"
        - $ref: "#/components/parameters/wardFilter"
        - $ref: "#/components/parameters/politicalUnitFilter"
        - name: officeId
          in: query
          description: Only return candidates running for this office.
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Candidate coverage page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CandidateCoverage"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/coverage/gaps:
    get:
      tags: [Coverage]
      summary: List polling units without an official agent
      description: Offset-paginated (unlike the other lists); `limit` can be up to 500.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateFilter"
        - $ref: "#/components/parameters/lgaFilter"
        - $ref: "#/components/parameters/wardFilter"
        - $ref: "#/components/parameters/politicalUnitFilter"
        - name: gps
          in: query
          description: GPS presence filter. `with` excludes null and zero coordinates; `without` includes both.
          schema:
            type: string
            enum: [all, with, without]
            default: all
        - name: limit
          in: query
          description: Maximum number of results (1–500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          description: Number of results to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated polling units with no official assignment.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          totalCount:
                            type: integer
                          limit:
                            type: integer
                          offset:
                            type: integer
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/CoverageGap"
                        required: [totalCount, limit, offset, items]
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/coverage/assignments:
    post:
      tags: [Coverage]
      summary: Create an agent assignment
      description: |
        Requires same-origin `Origin` and an authenticated session. Provide exactly one
        of `ownerGroupId` or `ownerCandidateId`. Official slot number is 0; extra slot
        numbers must be positive. Admins can manage any owner. Other users must manage
        the selected party/campaign group or their own candidate record and have scope
        access to the polling unit. A missing or invisible owner group returns 400
        with `validation_failed`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignment"
      responses:
        "201":
          description: Assignment created and audit event recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreatedAssignmentData"
        "400":
          description: Invalid JSON/input or a missing/invisible owner group (`validation_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Assignment conflicts with an existing assignment or slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/coverage/assignments/{assignmentId}:
    delete:
      tags: [Coverage]
      summary: Delete an agent assignment
      description: Requires same-origin `Origin`, an authenticated session, owner permission, and scope access.
      security:
        - sessionCookie: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assignment deleted and audit event recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOkResponse"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/telegram/webhook:
    post:
      tags: [Telegram]
      summary: Receive a Telegram bot update
      description: |
        Called by Telegram, not by browsers. Authenticated by the
        `X-Telegram-Bot-Api-Secret-Token` header, which must equal `TELEGRAM_WEBHOOK_SECRET`.
        Handles `/start`, contact sharing (links a confirmed phone number to a `telegram_chat_id`),
        consent buttons and delivery "OK" taps. Register it with `npm run telegram:webhook:set`.
        Handler timeout is 10 seconds.
      security:
        - telegramWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Telegram `Update` object (see the Telegram Bot API).
              additionalProperties: true
            example:
              update_id: 100000001
              message:
                message_id: 1
                chat: { id: 123456789, type: private }
                text: /start
      responses:
        "200":
          description: Update accepted (the body is empty or Telegram-formatted).
        "401":
          description: Missing or wrong secret token header.
          content:
            text/plain:
              schema:
                type: string
  /api/dev/queue-test:
    get:
      tags: [Development]
      summary: Per-queue job counts (dev only)
      description: Returns pg-boss counts for every known queue. Returns 404 `not_found` when `NODE_ENV=production`. No authentication.
      security: []
      responses:
        "200":
          description: Queue counts. A queue whose stats cannot be read returns `{ queue, error }` instead of counts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          queues:
                            type: array
                            items:
                              type: object
                              properties:
                                queue:
                                  type: string
                                counts:
                                  type: object
                                  properties:
                                    deferred: { type: integer }
                                    queued: { type: integer }
                                    ready: { type: integer }
                                    active: { type: integer }
                                    failed: { type: integer }
                                    total: { type: integer }
                                capturedOn:
                                  type: string
                                  format: date-time
                                error:
                                  type: string
                              required: [queue]
                        required: [queues]
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Development]
      summary: Enqueue test jobs (dev only)
      description: >-
        Enqueues `count` test jobs (clamped to 1-50, default 1). Send `fail: true` to make them
        fail and exercise retries. Returns 404 `not_found` when `NODE_ENV=production`. No authentication.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 1
                fail:
                  type: boolean
                  default: false
            example:
              count: 3
              fail: false
      responses:
        "200":
          description: Jobs enqueued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count:
                            type: integer
                          ids:
                            type: array
                            items:
                              type: [string, "null"]
                        required: [count, ids]
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/openapi:
    get:
      tags: [Docs]
      summary: OpenAPI specification (YAML)
      description: Serves this file with the first `servers` URL replaced by `SERVER_BASE_URL` when set.
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
  /api/docs:
    get:
      tags: [Docs]
      summary: Swagger UI
      security: []
      responses:
        "200":
          description: Swagger UI HTML page that loads `/api/openapi`.
          content:
            text/html:
              schema:
                type: string
components:
  securitySchemes:
    telegramWebhookSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: Shared secret set when the webhook is registered with Telegram (`TELEGRAM_WEBHOOK_SECRET`).
    sessionCookie:
      type: apiKey
      in: cookie
      name: collate_session
      description: |
        HTTP-only session cookie. In production its name is `__Host-collate_session`.
        Sign in through the OTP endpoints first. Swagger UI makes same-origin requests
        with credentials; the browser attaches the cookie automatically.
  parameters:
    stateId:
      name: stateId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    lgaId:
      name: lgaId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    wardId:
      name: wardId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    broadcastId:
      name: broadcastId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    stateFilter:
      name: stateId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    lgaFilter:
      name: lgaId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    wardFilter:
      name: wardId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    politicalUnitFilter:
      name: politicalUnitId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthenticated:
      description: A valid session is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Caller has no membership, lacks permission (`forbidden`), or sent a mutating request with a missing or mismatched Origin (`invalid_origin`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or outside caller's access scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidId:
      description: Invalid ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidFilter:
      description: Invalid filter or pagination value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AdminQueueData:
      type: object
      properties:
        summary:
          type: array
          items:
            $ref: "#/components/schemas/QueueSummaryRow"
        recent:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RecentQueueJob"
      required: [summary, recent]
    QueueSummaryRow:
      type: object
      properties:
        name:
          type: string
        created:
          type: integer
        active:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
        total:
          type: integer
      required: [name, created, active, completed, failed, cancelled, total]
    RecentQueueJob:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        state:
          type: string
        createdOn:
          type: string
          format: date-time
        startedOn:
          type: [string, "null"]
          format: date-time
        completedOn:
          type: [string, "null"]
          format: date-time
        retryCount:
          type: integer
        retryLimit:
          type: integer
        output:
          type: [string, "null"]
      required: [id, name, state, createdOn, startedOn, completedOn, retryCount, retryLimit, output]
    SuccessEnvelope:
      type: object
      properties:
        status:
          type: string
          const: success
        data: {}
        meta:
          $ref: "#/components/schemas/SuccessMeta"
      required: [status, data]
    SuccessMeta:
      type: object
      properties:
        nextCursor:
          type: [string, "null"]
        limit:
          type: integer
        total:
          type: integer
          description: Total matching items across all pages, when the route provides it.
        offices:
          type: array
          description: Offices with candidates in the filtered area. Returned on the first page of /api/coverage/candidates only, ignoring the officeId filter.
          items:
            $ref: "#/components/schemas/CandidateOfficeOption"
      additionalProperties: false
    CandidateOfficeOption:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        hierarchyLevel:
          type: integer
        count:
          type: integer
      required: [id, name, hierarchyLevel, count]
    SuccessOkResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/OkData"
    OkData:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          const: error
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - validation_failed
                - invalid_filter
                - unauthorized
                - invalid_or_expired_code
                - forbidden
                - invalid_origin
                - not_found
                - conflict
                - too_many_requests
                - internal_error
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
          required: [code, message]
      required: [status, error]
    PermissionsData:
      type: object
      properties:
        authenticated:
          type: boolean
          const: true
        permissions:
          type: object
          properties:
            isAdmin:
              type: boolean
            canManageCoverage:
              type: boolean
            canBroadcast:
              type: boolean
            roles:
              type: array
              items:
                type: string
          required: [isAdmin, canManageCoverage, canBroadcast, roles]
      required: [authenticated, permissions]
    CreatedAssignmentData:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        id:
          type: string
          format: uuid
      required: [ok, id]
    AudienceFilter:
      type: object
      properties:
        stateId:
          type: integer
          minimum: 1
        lgaId:
          type: integer
          minimum: 1
        wardId:
          type: integer
          minimum: 1
        pollingUnitId:
          type: integer
          minimum: 1
        politicalUnitId:
          type: integer
          minimum: 1
        officeId:
          type: integer
          minimum: 1
        ownerGroupId:
          type: integer
          minimum: 1
        verificationStatus:
          type: string
          enum: [unverified, verified, rejected]
        agentKind:
          type: string
          enum: [official, extra, all]
          default: all
      additionalProperties: false
    AudiencePreview:
      type: object
      properties:
        officialCount:
          type: integer
        extraCount:
          type: integer
      required: [officialCount, extraCount]
    CreateBroadcastInput:
      type: object
      properties:
        audienceFilter:
          $ref: "#/components/schemas/AudienceFilter"
        messageText:
          type: string
          minLength: 1
          maxLength: 1000
        scheduledSendAt:
          type: string
          format: date-time
          description: Optional send time within the next 90 days. Omit to send immediately.
      required: [audienceFilter, messageText]
      additionalProperties: false
    CreatedBroadcast:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, scheduled, sending, completed, failed, cancelled]
      required: [id, status]
    BroadcastListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, scheduled, sending, completed, failed, cancelled]
        title:
          type: string
          description: First 60 characters of the message, trimmed.
        messageText:
          type: string
          description: Truncated to 200 characters.
        sender:
          $ref: "#/components/schemas/BroadcastSender"
        audienceSummary:
          type: array
          items:
            type: string
          description: Names resolved from audience filter IDs; contains no recipient personal data.
        deliveryCounts:
          $ref: "#/components/schemas/BroadcastDeliveryCounts"
        scheduledSendAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, status, title, messageText, sender, audienceSummary, deliveryCounts, scheduledSendAt, createdAt]
    BroadcastSender:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
      required: [id, displayName]
    BroadcastDeliveryCounts:
      type: object
      properties:
        pending:
          type: integer
        sent:
          type: integer
        delivered:
          type: integer
        deliveredBySms:
          type: integer
        failed:
          type: integer
        tappedOk:
          type: integer
      required: [pending, sent, delivered, deliveredBySms, failed, tappedOk]
    BroadcastDetail:
      allOf:
        - $ref: "#/components/schemas/BroadcastListItem"
        - type: object
          properties:
            messageText:
              type: string
              description: Full message text.
          required: [messageText]
    BroadcastDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        fullName:
          type: string
        maskedPhone:
          type: [string, "null"]
        channel:
          type: string
          enum: [telegram, sms]
        status:
          type: string
          enum: [pending, sent, delivered, delivered_by_sms, failed, tapped_ok]
        sentAt:
          type: [string, "null"]
          format: date-time
        deliveredAt:
          type: [string, "null"]
          format: date-time
        tappedOkAt:
          type: [string, "null"]
          format: date-time
        failedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, personId, fullName, maskedPhone, channel, status, sentAt, deliveredAt, tappedOkAt, failedAt, createdAt]
    Agent:
      type: object
      properties:
        assignmentId:
          type: string
          format: uuid
        agentKind:
          type: string
          enum: [official, extra]
        slotNumber:
          type: integer
        personId:
          type: string
          format: uuid
        fullName:
          type: string
        maskedPhone:
          type: [string, "null"]
        telegramConnected:
          type: boolean
        pollingUnit:
          type: object
          properties:
            id:
              type: integer
            inecPollingUnitCode:
              type: string
            name:
              type: [string, "null"]
            wardName:
              type: string
            lgaName:
              type: string
            stateName:
              type: string
          required: [id, inecPollingUnitCode, name, wardName, lgaName, stateName]
        owner:
          type: object
          properties:
            type:
              type: string
              enum: [group, candidate]
            id:
              type: integer
            displayName:
              type: string
          required: [type, id, displayName]
      required: [assignmentId, agentKind, slotNumber, personId, fullName, maskedPhone, telegramConnected, pollingUnit, owner]
    AgentSummary:
      type: object
      properties:
        total:
          type: integer
        official:
          type: integer
        extra:
          type: integer
        telegramConnected:
          type: integer
        notConnected:
          type: integer
      required: [total, official, extra, telegramConnected, notConnected]
    SessionPerson:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        emailAddress:
          type: [string, "null"]
          format: email
        isAdmin:
          type: boolean
        candidateId:
          type: [integer, "null"]
      required: [id, fullName, emailAddress, isAdmin, candidateId]
    StateCoverage:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        totalPUs:
          type: integer
        gpsPUs:
          type: integer
        coveredPUs:
          type: integer
        noCoveragePUs:
          type: integer
        officialAgentPct:
          type: integer
        extraAgentsCount:
          type: integer
        lgasCount:
          type: integer
        wardsCount:
          type: integer
      required: [id, code, name, totalPUs, gpsPUs, coveredPUs, noCoveragePUs, officialAgentPct, extraAgentsCount]
    LgaCoverage:
      type: object
      properties:
        id:
          type: integer
        stateId:
          type: integer
        inecStateCode:
          type: string
        code:
          type: string
        name:
          type: string
        totalPUs:
          type: integer
        gpsPUs:
          type: integer
        coveredPUs:
          type: integer
        noCoveragePUs:
          type: integer
        officialAgentPct:
          type: integer
        extraAgentsCount:
          type: integer
        wardsCount:
          type: integer
      required: [id, stateId, inecStateCode, code, name, totalPUs, gpsPUs, coveredPUs, noCoveragePUs, officialAgentPct, extraAgentsCount, wardsCount]
    WardCoverage:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        totalPUs:
          type: integer
        gpsPUs:
          type: integer
        coveredPUs:
          type: integer
        noCoveragePUs:
          type: integer
        officialAgentPct:
          type: integer
        extraAgentsCount:
          type: integer
      required: [id, code, name, totalPUs, gpsPUs, coveredPUs, noCoveragePUs, officialAgentPct, extraAgentsCount]
    PollingUnit:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        wardCode:
          type: string
        lgaCode:
          type: string
        stateCode:
          type: string
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
        hasGPS:
          type: boolean
        hasGps:
          type: boolean
        hasOfficialAgent:
          type: boolean
        agents:
          type: array
          items:
            $ref: "#/components/schemas/PollingUnitAgent"
      required: [id, code, name, wardCode, lgaCode, stateCode, latitude, longitude, hasGPS, hasGps, hasOfficialAgent, agents]
      example:
        id: 5082
        code: 01/13/09/001
        name: Central School Ohuru
        wardCode: "09"
        lgaCode: "13"
        stateCode: "01"
        latitude: null
        longitude: null
        hasGPS: false
        hasGps: false
        hasOfficialAgent: true
        agents:
          - assignmentId: 3f2a7c1e-9b4d-4e6f-8a21-5c7d9e0b1a34
            agentKind: official
            slotNumber: 0
            fullName: Ada Okafor
            maskedPhone: "+234 *** *** 4567"
            owner: { type: group, id: 2, displayName: NDC }
    PollingUnitAgent:
      type: object
      description: One agent assigned to a polling unit. The phone number is masked.
      properties:
        assignmentId:
          type: string
          format: uuid
        agentKind:
          type: string
          enum: [official, extra]
        slotNumber:
          type: integer
          description: 0 for the official agent, 1 or more for extra agents.
        fullName:
          type: string
        maskedPhone:
          type: [string, "null"]
        owner:
          type: object
          properties:
            type:
              type: string
              enum: [group, candidate]
            id:
              type: integer
            displayName:
              type: string
          required: [type, id, displayName]
      required: [assignmentId, agentKind, slotNumber, fullName, maskedPhone, owner]
    CoverageSummary:
      type: object
      properties:
        totalPUs:
          type: integer
        coveredPUs:
          type: integer
        noCoveragePUs:
          type: integer
        gpsPUs:
          type: integer
        extraAgentsCount:
          type: integer
        officialAgentPct:
          type: integer
      required: [totalPUs, coveredPUs, noCoveragePUs, gpsPUs, extraAgentsCount, officialAgentPct]
    CoverageMapPoint:
      type: object
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        totalPUs:
          type: integer
          minimum: 1
        coveredPUs:
          type: integer
          minimum: 0
      required: [latitude, longitude, totalPUs, coveredPUs]
      example:
        latitude: 6.5244
        longitude: 3.3792
        totalPUs: 3
        coveredPUs: 2
    CoverageMapPointsResponse:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/CoverageMapPoint"
      required: [points]
    CandidateCoverage:
      type: object
      properties:
        id:
          type: integer
        office:
          type: string
        hierarchyLevel:
          type: integer
        seat:
          type: string
        stateId:
          type: [integer, "null"]
          description: State the seat sits in; null for national seats.
        inecStateCode:
          type: [string, "null"]
        name:
          type: string
        deputyName:
          type: [string, "null"]
        maskedPhone:
          type: [string, "null"]
          description: Masked phone number; the full number is never returned.
        channelStatus:
          type: string
          enum: [connected, sms_only, not_matched]
        isOffCycle:
          type: boolean
          description: True when the seat's state votes off-cycle on the latest election day for this office.
        totalPUs:
          type: integer
        coveredPUs:
          type: integer
        coveragePct:
          type: integer
        extraAgentsCount:
          type: integer
      required: [id, office, hierarchyLevel, seat, stateId, inecStateCode, name, deputyName, maskedPhone, channelStatus, isOffCycle, totalPUs, coveredPUs, coveragePct, extraAgentsCount]
    CoverageGap:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
        hasGPS:
          type: boolean
        hasGps:
          type: boolean
        ward:
          $ref: "#/components/schemas/Area"
        lga:
          $ref: "#/components/schemas/Area"
        state:
          $ref: "#/components/schemas/Area"
      required: [id, code, name, latitude, longitude, hasGPS, hasGps, ward, lga, state]
    Area:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required: [code, name]
    CreateAssignment:
      type: object
      properties:
        personId:
          type: string
          format: uuid
        pollingUnitId:
          type: integer
          minimum: 1
        ownerGroupId:
          description: Provide exactly one of ownerGroupId and ownerCandidateId.
          type: [integer, "null"]
          minimum: 1
        ownerCandidateId:
          description: Provide exactly one of ownerGroupId and ownerCandidateId.
          type: [integer, "null"]
          minimum: 1
        agentKind:
          type: string
          enum: [official, extra]
        slotNumber:
          type: integer
          minimum: 0
      required: [personId, pollingUnitId, agentKind, slotNumber]
      example:
        personId: 03ea6f24-8b10-4f97-95f5-9913c6b79676
        pollingUnitId: 120
        ownerGroupId: 4
        ownerCandidateId: null
        agentKind: official
        slotNumber: 0
