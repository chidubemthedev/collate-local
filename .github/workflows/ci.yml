name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Throwaway values only. Telegram never sends (dry run), SMS is off, and the database is a
# fresh Postgres service per job. No real secrets are needed.
env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/collate_test
  DATABASE_SSL: "false"
  AUTH_SECRET: ci-only-auth-secret-at-least-32-characters-long
  SERVER_BASE_URL: http://localhost:3000
  OTP_DELIVERY: console
  TELEGRAM_BOT_TOKEN: "123456:ci-dummy-token"
  TELEGRAM_BOT_USERNAME: collate_ci_bot
  TELEGRAM_WEBHOOK_SECRET: ci_webhook_secret_123
  SMS_PROVIDER: none
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Migrate test database
        run: npm run db:migrate
      - name: Unit and database tests
        run: npm test
        env:
          RUN_DB_TESTS: "true"
      - name: Scope tests (test-script fixture)
        run: npm run test:scope

  e2e:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      E2E_PRODUCTION: "true"
      E2E_SERVER_COMMAND: npm run start
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Migrate test database
        run: npm run db:migrate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
