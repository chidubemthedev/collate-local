openapi: 3.0.3
info:
  title: Collate API
  version: 1.0.0
  description: |
    Authentication, geography, and polling-unit coverage APIs.

    Protected endpoints use the HTTP-only session cookie issued by
    `POST /api/auth/otp/verify`. The cookie is named `collate_session` outside
    production and `__Host-collate_session` in production. Swagger UI sends
    same-origin cookies automatically after a successful sign-in. Swagger UI
    uses `SERVER_BASE_URL` from the environment for the server URL when set.
servers:
  - url: /
    description: Current Collate deployment
tags:
  - name: Health
  - name: Authentication
  - name: Geography
  - name: Coverage
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check service health
      security: []
      responses:
        "200":
          description: Database is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                required: [ok]
        "500":
          description: Database health check failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                required: [ok]
  /api/auth/otp/request:
    post:
      tags: [Authentication]
      summary: Request an email one-time password
      description: Requires an eligible registered person. Requests are rate-limited per email and IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: person@example.com
              required: [email]
      responses:
        "200":
          description: OTP sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "404":
          description: No eligible person found for the email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /api/auth/otp/verify:
    post:
      tags: [Authentication]
      summary: Verify an OTP and create a session
      description: On success, sets the HTTP-only session cookie in the response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^\\d{6}$"
                  example: "123456"
              required: [email, code]
      responses:
        "200":
          description: OTP verified and session cookie set.
          headers:
            Set-Cookie:
              description: HTTP-only session cookie; cookie name varies by environment.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: OTP is invalid, expired, or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /api/auth/session:
    get:
      tags: [Authentication]
      summary: Read the current session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session state. An absent, expired, or invalid session returns authenticated false.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      authenticated:
                        type: boolean
                        enum: [false]
                    required: [authenticated]
                  - type: object
                    properties:
                      authenticated:
                        type: boolean
                        enum: [true]
                      person:
                        $ref: "#/components/schemas/SessionPerson"
                    required: [authenticated, person]
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session revoked and cookie cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                required: [ok]
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                required: [ok]
  /api/auth/permissions:
    get:
      tags: [Authentication]
      summary: Read roles and permission flags
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authenticated caller permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    example: true
                  permissions:
                    type: object
                    properties:
                      isAdmin:
                        type: boolean
                      canManageCoverage:
                        type: boolean
                      canBroadcast:
                        type: boolean
                      roles:
                        type: array
                        items:
                          type: string
                    required: [isAdmin, canManageCoverage, canBroadcast, roles]
                required: [authenticated, permissions]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/geography/states:
    get:
      tags: [Geography]
      summary: List accessible states and coverage counts
      security:
        - sessionCookie: []
      responses:
        "200":
          description: States available within the caller's membership scope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateCoverage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/geography/states/{stateId}:
    get:
      tags: [Geography]
      summary: Read state coverage
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateId"
      responses:
        "200":
          description: State coverage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateCoverage"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/geography/states/{stateId}/lgas:
    get:
      tags: [Geography]
      summary: List accessible LGAs in a state
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateId"
      responses:
        "200":
          description: LGAs and their coverage counts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LgaCoverage"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/geography/lgas/{lgaId}/wards:
    get:
      tags: [Geography]
      summary: List accessible wards in an LGA
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/lgaId"
      responses:
        "200":
          description: Wards and their coverage counts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WardCoverage"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/geography/wards/{wardId}/polling-units:
    get:
      tags: [Geography]
      summary: List accessible polling units and assigned agents in a ward
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/wardId"
      responses:
        "200":
          description: Polling units with location and agent details.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PollingUnit"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/coverage/summary:
    get:
      tags: [Coverage]
      summary: Get coverage totals
      description: Counts an official assignment as covered. Filters can be combined.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateFilter"
        - $ref: "#/components/parameters/lgaFilter"
        - $ref: "#/components/parameters/wardFilter"
        - $ref: "#/components/parameters/politicalUnitFilter"
      responses:
        "200":
          description: Coverage totals for the accessible filtered area.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageSummary"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/coverage/gaps:
    get:
      tags: [Coverage]
      summary: List polling units without an official agent
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateFilter"
        - $ref: "#/components/parameters/lgaFilter"
        - $ref: "#/components/parameters/wardFilter"
        - $ref: "#/components/parameters/politicalUnitFilter"
        - name: limit
          in: query
          description: Maximum number of results (1–500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          description: Number of results to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated polling units with no official assignment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CoverageGap"
                required: [totalCount, limit, offset, items]
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/coverage/assignments:
    post:
      tags: [Coverage]
      summary: Create an agent assignment
      description: |
        Requires same-origin `Origin` and an authenticated session. Provide exactly one
        of `ownerGroupId` or `ownerCandidateId`. Official slot number is 0; extra slot
        numbers must be positive. Admins can manage any owner. Other users must manage
        the selected party/campaign group or their own candidate record and have scope
        access to the polling unit.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignment"
      responses:
        "201":
          description: Assignment created and audit event recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  id:
                    type: string
                    format: uuid
                required: [ok, id]
        "400":
          description: Invalid JSON or assignment input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Assignment conflicts with an existing assignment or slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/coverage/assignments/{assignmentId}:
    delete:
      tags: [Coverage]
      summary: Delete an agent assignment
      description: Requires same-origin `Origin`, an authenticated session, owner permission, and scope access.
      security:
        - sessionCookie: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assignment deleted and audit event recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: collate_session
      description: |
        HTTP-only session cookie. In production its name is `__Host-collate_session`.
        Sign in through the OTP endpoints first. Swagger UI makes same-origin requests
        with credentials; the browser attaches the cookie automatically.
  parameters:
    stateId:
      name: stateId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    lgaId:
      name: lgaId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    wardId:
      name: wardId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    stateFilter:
      name: stateId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    lgaFilter:
      name: lgaId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    wardFilter:
      name: wardId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    politicalUnitFilter:
      name: politicalUnitId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthenticated:
      description: A valid session is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Caller does not have permission to access this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or outside caller's access scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidId:
      description: Invalid ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidFilter:
      description: Invalid filter or pagination value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
      required: [ok]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: unauthenticated
      required: [error]
    AuthErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
          example: invalid_or_expired_code
      required: [ok, error]
    SessionPerson:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        emailAddress:
          type: string
          format: email
          nullable: true
        isAdmin:
          type: boolean
        candidateId:
          type: integer
          nullable: true
      required: [id, fullName, emailAddress, isAdmin, candidateId]
    StateCoverage:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        totalPUs:
          type: integer
        gpsPUs:
          type: integer
        coveredPUs:
          type: integer
        noCoveragePUs:
          type: integer
        officialAgentPct:
          type: integer
        extraAgentsCount:
          type: integer
        lgasCount:
          type: integer
        wardsCount:
          type: integer
      required: [id, code, name, totalPUs, gpsPUs, coveredPUs, noCoveragePUs, officialAgentPct, extraAgentsCount]
    LgaCoverage:
      type: object
      properties:
        id:
          type: integer
        stateCode:
          type: string
        code:
          type: string
        name:
          type: string
        totalPUs:
          type: integer
        gpsPUs:
          type: integer
        coveredPUs:
          type: integer
        noCoveragePUs:
          type: integer
        officialAgentPct:
          type: integer
        extraAgentsCount:
          type: integer
        wardsCount:
          type: integer
      required: [id, stateCode, code, name, totalPUs, gpsPUs, coveredPUs, noCoveragePUs, officialAgentPct, extraAgentsCount, wardsCount]
    WardCoverage:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        totalPUs:
          type: integer
        gpsPUs:
          type: integer
        coveredPUs:
          type: integer
        noCoveragePUs:
          type: integer
        officialAgentPct:
          type: integer
        extraAgentsCount:
          type: integer
      required: [id, code, name, totalPUs, gpsPUs, coveredPUs, noCoveragePUs, officialAgentPct, extraAgentsCount]
    PollingUnit:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        wardCode:
          type: string
        lgaCode:
          type: string
        stateCode:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        hasGPS:
          type: boolean
        hasOfficialAgent:
          type: boolean
        officialAgentName:
          type: string
        officialAgentPhone:
          type: string
        officialAgentTelegramStatus:
          type: string
        extraAgents:
          type: array
          items:
            $ref: "#/components/schemas/ExtraAgent"
      required: [id, code, name, wardCode, lgaCode, stateCode, latitude, longitude, hasGPS, hasOfficialAgent, extraAgents]
    ExtraAgent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner:
          type: string
        role:
          type: string
        phone:
          type: string
          nullable: true
        telegramStatus:
          type: string
      required: [id, name, owner, role, phone, telegramStatus]
    CoverageSummary:
      type: object
      properties:
        totalPUs:
          type: integer
        coveredPUs:
          type: integer
        noCoveragePUs:
          type: integer
        gpsPUs:
          type: integer
        extraAgentsCount:
          type: integer
        officialAgentPct:
          type: integer
      required: [totalPUs, coveredPUs, noCoveragePUs, gpsPUs, extraAgentsCount, officialAgentPct]
    CoverageGap:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        hasGPS:
          type: boolean
        ward:
          $ref: "#/components/schemas/Area"
        lga:
          $ref: "#/components/schemas/Area"
        state:
          $ref: "#/components/schemas/Area"
      required: [id, code, name, latitude, longitude, hasGPS, ward, lga, state]
    Area:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required: [code, name]
    CreateAssignment:
      type: object
      properties:
        personId:
          type: string
          format: uuid
        pollingUnitId:
          type: integer
          minimum: 1
        ownerGroupId:
          description: Provide exactly one of ownerGroupId and ownerCandidateId.
          type: integer
          minimum: 1
          nullable: true
        ownerCandidateId:
          description: Provide exactly one of ownerGroupId and ownerCandidateId.
          type: integer
          minimum: 1
          nullable: true
        agentKind:
          type: string
          enum: [official, extra]
        slotNumber:
          type: integer
          minimum: 0
      required: [personId, pollingUnitId, agentKind, slotNumber]
      example:
        personId: 03ea6f24-8b10-4f97-95f5-9913c6b79676
        pollingUnitId: 120
        ownerGroupId: 4
        ownerCandidateId: null
        agentKind: official
        slotNumber: 0
