name: CI

on:
  # Every push, on any branch, and every pull request into main.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only reads the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older run, except on main, where every commit
# gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Throwaway values only: the Telegram token is fake, SMS is off, and the database is a fresh
# Postgres service per job. No real secrets are needed.
env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/collate_test
  DATABASE_SSL: "false"
  AUTH_SECRET: ci-only-auth-secret-at-least-32-characters-long
  SERVER_BASE_URL: http://localhost:3000
  OTP_DELIVERY: console
  TELEGRAM_BOT_TOKEN: "123456:ci-dummy-token"
  TELEGRAM_BOT_USERNAME: collate_ci_bot
  TELEGRAM_WEBHOOK_SECRET: ci_webhook_secret_123
  SMS_PROVIDER: none
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      # Belt and braces: nothing here sends, and dry run is refused in production mode, so it is
      # set for this job only (the browser-test job runs `next start`, which is production).
      TELEGRAM_DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Migrate test database
        run: npm run db:migrate
      - name: Unit and database tests
        run: npm test
        env:
          RUN_DB_TESTS: "true"
      - name: Scope tests (test-script fixture)
        run: npm run test:scope

  e2e:
    name: Build and browser tests
    # Only once lint, types and tests pass: no build or browser run for a change that is already red.
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      E2E_PRODUCTION: "true"
      E2E_SERVER_COMMAND: npm run start
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Migrate test database
        run: npm run db:migrate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
