openapi: 3.1.0
info:
  title: Collate API
  version: 1.0.0
  description: |
    Authentication, geography, and polling-unit coverage APIs.
    JSON success responses use `{ status: "success", data }`; failures use
    `{ status: "error", error: { code, message, fields? } }`.

    Protected endpoints use the HTTP-only session cookie issued by
    `POST /api/auth/otp/verify`. The cookie is named `collate_session` outside
    production and `__Host-collate_session` in production. Swagger UI sends
    same-origin cookies automatically after a successful sign-in. Swagger UI
    uses `SERVER_BASE_URL` from the environment for the server URL when set.
servers:
  - url: /
    description: Current Collate deployment
tags:
  - name: Health
  - name: Authentication
  - name: Agents
  - name: Admin
  - name: Broadcasts
  - name: Geography
  - name: Coverage
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check service health
      security: []
      responses:
        "200":
          description: Database is reachable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OkData"
        "500":
          description: Database health check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/otp/request:
    post:
      tags: [Authentication]
      summary: Request an email one-time password
      description: Requires an eligible registered person. Requests are rate-limited per email and IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: person@example.com
              required: [email]
      responses:
        "200":
          description: OTP sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOkResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No eligible person found for the email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/otp/verify:
    post:
      tags: [Authentication]
      summary: Verify an OTP and create a session
      description: On success, sets the HTTP-only session cookie in the response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^\\d{6}$"
                  example: "123456"
              required: [email, code]
      responses:
        "200":
          description: OTP verified and session cookie set.
          headers:
            Set-Cookie:
              description: HTTP-only session cookie; cookie name varies by environment.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOkResponse"
        "400":
          description: OTP is invalid, expired, or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/session:
    get:
      tags: [Authentication]
      summary: Read the current session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session state. An absent, expired, or invalid session returns authenticated false.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - type: object
                            properties:
                              authenticated:
                                type: boolean
                                const: false
                            required: [authenticated]
                          - type: object
                            properties:
                              authenticated:
                                type: boolean
                                const: true
                              person:
                                $ref: "#/components/schemas/SessionPerson"
                            required: [authenticated, person]
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session revoked and cookie cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOkResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/permissions:
    get:
      tags: [Authentication]
      summary: Read roles and permission flags
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authenticated caller permissions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PermissionsData"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/admin/queue:
    get:
      tags: [Admin]
      summary: Read the background job queue
      description: Requires an authenticated administrator. Returns job counts by name and up to 50 recent jobs.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Queue summary and recent jobs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminQueueData"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/agents:
    get:
      tags: [Agents]
      summary: List visible agents
      description: Returns authorized agents with masked phone numbers and cursor pagination.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateFilter"
        - $ref: "#/components/parameters/lgaFilter"
        - $ref: "#/components/parameters/wardFilter"
        - $ref: "#/components/parameters/politicalUnitFilter"
        - name: ownerGroupId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: ownerCandidateId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: agentKind
          in: query
          schema:
            type: string
            enum: [official, extra]
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Visible agent page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Agent"
                      meta:
                        $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/broadcasts/preview:
    post:
      tags: [Broadcasts]
      summary: Preview an audience
      description: Returns the official and extra agent counts the caller's filters would reach. The request must include a matching Origin header.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudienceFilter"
      responses:
        "200":
          description: Audience counts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AudiencePreview"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/broadcasts:
    get:
      tags: [Broadcasts]
      summary: List broadcasts
      description: Admins see every broadcast; other callers see only broadcasts they sent. Delivery counts are grouped in one query, and sender/audience labels contain no personal phone data.
      security:
        - sessionCookie: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of broadcasts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/BroadcastListItem"
                      meta:
                        $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Broadcasts]
      summary: Create a broadcast
      description: Creates a broadcast and queues audience resolution. The request must include a matching Origin header. Scheduled broadcasts are queued for their send time.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBroadcastInput"
      responses:
        "201":
          description: Broadcast created and queued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreatedBroadcast"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/broadcasts/{broadcastId}:
    get:
      tags: [Broadcasts]
      summary: Read a broadcast
      description: Returns broadcast details and delivery counts. A broadcast outside the caller's visibility returns 404.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/broadcastId"
      responses:
        "200":
          description: Broadcast detail and delivery counts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BroadcastDetail"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/broadcasts/{broadcastId}/deliveries:
    get:
      tags: [Broadcasts]
      summary: List broadcast deliveries
      description: Returns delivery rows with masked phone numbers and available delivery timestamps, and writes an audit event. Per-recipient assignment area, group, and source citation are not stored with delivery records. A broadcast outside the caller's visibility returns 404.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/broadcastId"
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/BroadcastDelivery"
                      meta:
                        $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/geography/states:
    get:
      tags: [Geography]
      summary: List accessible states and coverage counts
      security:
        - sessionCookie: []
      responses:
        "200":
          description: States available within the caller's membership scope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/StateCoverage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/geography/states/{stateId}:
    get:
      tags: [Geography]
      summary: Read state coverage
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateId"
      responses:
        "200":
          description: State coverage.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/StateCoverage"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/geography/states/{stateId}/lgas:
    get:
      tags: [Geography]
      summary: List accessible LGAs in a state
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateId"
      responses:
        "200":
          description: LGAs and their coverage counts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/LgaCoverage"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/geography/lgas/{lgaId}/wards:
    get:
      tags: [Geography]
      summary: List accessible wards in an LGA
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/lgaId"
      responses:
        "200":
          description: Wards and their coverage counts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/WardCoverage"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/geography/wards/{wardId}/polling-units:
    get:
      tags: [Geography]
      summary: List accessible polling units and assigned agents in a ward
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/wardId"
      responses:
        "200":
          description: Polling units with location and agent details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PollingUnit"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/coverage/summary:
    get:
      tags: [Coverage]
      summary: Get coverage totals
      description: Counts an official assignment as covered. Filters can be combined.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateFilter"
        - $ref: "#/components/parameters/lgaFilter"
        - $ref: "#/components/parameters/wardFilter"
        - $ref: "#/components/parameters/politicalUnitFilter"
      responses:
        "200":
          description: Coverage totals for the accessible filtered area.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CoverageSummary"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/coverage/candidates:
    get:
      tags: [Coverage]
      summary: List candidates with coverage for their seat
      description: >-
        Returns principal candidates whose seat contains polling units in the accessible filtered area.
        Counts are limited to that area. A polling unit is covered when the candidate owns an official
        assignment on it. Ordered by office hierarchy, then candidate ID. Writes an audit log row.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateFilter"
        - $ref: "#/components/parameters/lgaFilter"
        - $ref: "#/components/parameters/wardFilter"
        - $ref: "#/components/parameters/politicalUnitFilter"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Candidate coverage page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CandidateCoverage"
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/coverage/gaps:
    get:
      tags: [Coverage]
      summary: List polling units without an official agent
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/stateFilter"
        - $ref: "#/components/parameters/lgaFilter"
        - $ref: "#/components/parameters/wardFilter"
        - $ref: "#/components/parameters/politicalUnitFilter"
        - name: limit
          in: query
          description: Maximum number of results (1–500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          description: Number of results to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated polling units with no official assignment.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          totalCount:
                            type: integer
                          limit:
                            type: integer
                          offset:
                            type: integer
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/CoverageGap"
                        required: [totalCount, limit, offset, items]
        "400":
          $ref: "#/components/responses/InvalidFilter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/coverage/assignments:
    post:
      tags: [Coverage]
      summary: Create an agent assignment
      description: |
        Requires same-origin `Origin` and an authenticated session. Provide exactly one
        of `ownerGroupId` or `ownerCandidateId`. Official slot number is 0; extra slot
        numbers must be positive. Admins can manage any owner. Other users must manage
        the selected party/campaign group or their own candidate record and have scope
        access to the polling unit. A missing or invisible owner group returns 400
        with `validation_failed`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignment"
      responses:
        "201":
          description: Assignment created and audit event recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreatedAssignmentData"
        "400":
          description: Invalid JSON/input or a missing/invisible owner group (`validation_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Assignment conflicts with an existing assignment or slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/coverage/assignments/{assignmentId}:
    delete:
      tags: [Coverage]
      summary: Delete an agent assignment
      description: Requires same-origin `Origin`, an authenticated session, owner permission, and scope access.
      security:
        - sessionCookie: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assignment deleted and audit event recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessOkResponse"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: collate_session
      description: |
        HTTP-only session cookie. In production its name is `__Host-collate_session`.
        Sign in through the OTP endpoints first. Swagger UI makes same-origin requests
        with credentials; the browser attaches the cookie automatically.
  parameters:
    stateId:
      name: stateId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    lgaId:
      name: lgaId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    wardId:
      name: wardId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    broadcastId:
      name: broadcastId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    stateFilter:
      name: stateId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    lgaFilter:
      name: lgaId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    wardFilter:
      name: wardId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    politicalUnitFilter:
      name: politicalUnitId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthenticated:
      description: A valid session is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Caller does not have permission to access this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or outside caller's access scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidId:
      description: Invalid ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidFilter:
      description: Invalid filter or pagination value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AdminQueueData:
      type: object
      properties:
        summary:
          type: array
          items:
            $ref: "#/components/schemas/QueueSummaryRow"
        recent:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RecentQueueJob"
      required: [summary, recent]
    QueueSummaryRow:
      type: object
      properties:
        name:
          type: string
        created:
          type: integer
        active:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
        total:
          type: integer
      required: [name, created, active, completed, failed, cancelled, total]
    RecentQueueJob:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        state:
          type: string
        createdOn:
          type: string
          format: date-time
        startedOn:
          type: [string, "null"]
          format: date-time
        completedOn:
          type: [string, "null"]
          format: date-time
        retryCount:
          type: integer
        retryLimit:
          type: integer
        output:
          type: [string, "null"]
      required: [id, name, state, createdOn, startedOn, completedOn, retryCount, retryLimit, output]
    SuccessEnvelope:
      type: object
      properties:
        status:
          type: string
          const: success
        data: {}
        meta:
          $ref: "#/components/schemas/SuccessMeta"
      required: [status, data]
    SuccessMeta:
      type: object
      properties:
        nextCursor:
          type: [string, "null"]
        limit:
          type: integer
        total:
          type: integer
          description: Total matching items across all pages, when the route provides it.
      additionalProperties: false
    SuccessOkResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/OkData"
    OkData:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          const: error
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - validation_failed
                - invalid_filter
                - unauthorized
                - invalid_or_expired_code
                - forbidden
                - invalid_origin
                - not_found
                - conflict
                - too_many_requests
                - internal_error
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
          required: [code, message]
      required: [status, error]
    PermissionsData:
      type: object
      properties:
        authenticated:
          type: boolean
          const: true
        permissions:
          type: object
          properties:
            isAdmin:
              type: boolean
            canManageCoverage:
              type: boolean
            canBroadcast:
              type: boolean
            roles:
              type: array
              items:
                type: string
          required: [isAdmin, canManageCoverage, canBroadcast, roles]
      required: [authenticated, permissions]
    CreatedAssignmentData:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        id:
          type: string
          format: uuid
      required: [ok, id]
    AudienceFilter:
      type: object
      properties:
        stateId:
          type: integer
          minimum: 1
        lgaId:
          type: integer
          minimum: 1
        wardId:
          type: integer
          minimum: 1
        politicalUnitId:
          type: integer
          minimum: 1
        officeId:
          type: integer
          minimum: 1
        ownerGroupId:
          type: integer
          minimum: 1
        agentKind:
          type: string
          enum: [official, extra, all]
          default: all
      additionalProperties: false
    AudiencePreview:
      type: object
      properties:
        officialCount:
          type: integer
        extraCount:
          type: integer
      required: [officialCount, extraCount]
    CreateBroadcastInput:
      type: object
      properties:
        audienceFilter:
          $ref: "#/components/schemas/AudienceFilter"
        messageText:
          type: string
          minLength: 1
          maxLength: 1000
        scheduledSendAt:
          type: string
          format: date-time
          description: Optional send time within the next 90 days. Omit to send immediately.
      required: [audienceFilter, messageText]
      additionalProperties: false
    CreatedBroadcast:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, scheduled, sending, completed, failed, cancelled]
      required: [id, status]
    BroadcastListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, scheduled, sending, completed, failed, cancelled]
        title:
          type: string
          description: First 60 characters of the message, trimmed.
        messageText:
          type: string
          description: Truncated to 200 characters.
        sender:
          $ref: "#/components/schemas/BroadcastSender"
        audienceSummary:
          type: array
          items:
            type: string
          description: Names resolved from audience filter IDs; contains no recipient personal data.
        deliveryCounts:
          $ref: "#/components/schemas/BroadcastDeliveryCounts"
        scheduledSendAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, status, title, messageText, sender, audienceSummary, deliveryCounts, scheduledSendAt, createdAt]
    BroadcastSender:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
      required: [id, displayName]
    BroadcastDeliveryCounts:
      type: object
      properties:
        pending:
          type: integer
        sent:
          type: integer
        delivered:
          type: integer
        deliveredBySms:
          type: integer
        failed:
          type: integer
        tappedOk:
          type: integer
      required: [pending, sent, delivered, deliveredBySms, failed, tappedOk]
    BroadcastDetail:
      allOf:
        - $ref: "#/components/schemas/BroadcastListItem"
        - type: object
          properties:
            messageText:
              type: string
              description: Full message text.
          required: [messageText]
    BroadcastDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        fullName:
          type: string
        maskedPhone:
          type: [string, "null"]
        channel:
          type: string
          enum: [telegram, sms]
        status:
          type: string
          enum: [pending, sent, delivered, delivered_by_sms, failed, tapped_ok]
        sentAt:
          type: [string, "null"]
          format: date-time
        deliveredAt:
          type: [string, "null"]
          format: date-time
        tappedOkAt:
          type: [string, "null"]
          format: date-time
        failedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, personId, fullName, maskedPhone, channel, status, sentAt, deliveredAt, tappedOkAt, failedAt, createdAt]
    Agent:
      type: object
      properties:
        assignmentId:
          type: string
          format: uuid
        agentKind:
          type: string
          enum: [official, extra]
        slotNumber:
          type: integer
        personId:
          type: string
          format: uuid
        fullName:
          type: string
        maskedPhone:
          type: [string, "null"]
        pollingUnit:
          type: object
